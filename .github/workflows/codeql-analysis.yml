name: CodeQL SAST Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  analyze:
    name: Analyze (${{ matrix.workspace }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: backend
            directory: .
          - workspace: frontend
            directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies (${{ matrix.workspace }})
        working-directory: ${{ matrix.directory }}
        run: npm ci || npm install

      - name: Build TypeScript (${{ matrix.workspace }})
        working-directory: ${{ matrix.directory }}
        run: |
          if [ "${{ matrix.workspace }}" = "frontend" ]; then
            npm run build
          else
            npm run build --if-present
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          source-root: ${{ matrix.directory }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript/workspace:${{ matrix.workspace }}
          upload: always
